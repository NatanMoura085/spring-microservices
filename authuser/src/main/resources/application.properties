spring.application.name=ead-authuser-service


server.port=8087


spring.datasource.url=jdbc:postgresql://localhost:5432/ead_authuser_v2
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=*

ead.api.url.course=http://ead-course-service

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true


# server.servlet.context-path=/ead-authuser

logging.level.com.netflix.discovery=DEBUG

spring.rabbitmq.addresses=amqps://toizkunb:vjn8Zjfl4R4vvd5Q833SMoNrMQvO6Llt@leopard.lmq.cloudamqp.com/toizkunb

ead.broker.exchange.userEvent=ead.userevent


# Circuit Breaker
resilience4j.circuitbreaker.instances.circuitInstance.register-health-indicator=true
resilience4j.circuitbreaker.instances.circuitInstance.sliding-window-size=4
resilience4j.circuitbreaker.instances.circuitInstance.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.circuitInstance.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.circuitInstance.failure-rate-threshold=50

# Retry
resilience4j.retry.instances.retryInstance.max-attempts=3
resilience4j.retry.instances.retryInstance.wait-duration=1s

# TimeLimiter (opcional)
resilience4j.timelimiter.instances.circuitInstance.timeout-duration=3s



logging.level.io.github.resilience4j=DEBUG

#SPRING ACTUATOR
management.endpoint.health.show-details=always

