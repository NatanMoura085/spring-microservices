apiVersion: apps/v1
kind: Deployment
metadata:
  name: ead-api-gateway
  namespace: ead
  labels:
    app: ead-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ead-api-gateway
  template:
    metadata:
      labels:
        app: ead-api-gateway
    spec:
      containers:
        - name: ead-api-gateway
          image: yourrepo/ead-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
