apiVersion: apps/v1
kind: Deployment
metadata:
  name: ead-authuser
  namespace: ead
  labels:
    app: ead-authuser
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ead-authuser
  template:
    metadata:
      labels:
        app: ead-authuser
    spec:
      containers:
        - name: ead-authuser
          image: yourrepo/ead-authuser:latest
          ports:
            - containerPort: 8087
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://ead-service-registry:8761/eureka"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
