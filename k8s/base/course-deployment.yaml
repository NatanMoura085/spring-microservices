apiVersion: apps/v1
kind: Deployment
metadata:
  name: ead-course
  namespace: ead
  labels:
    app: ead-course
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ead-course
  template:
    metadata:
      labels:
        app: ead-course
    spec:
      containers:
        - name: ead-course
          image: yourrepo/ead-course:latest
          ports:
            - containerPort: 8082
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://ead-service-registry:8761/eureka"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
