apiVersion: apps/v1
kind: Deployment
metadata:
  name: ead-config
  namespace: ead
  labels:
    app: ead-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ead-config
  template:
    metadata:
      labels:
        app: ead-config
    spec:
      containers:
        - name: ead-config
          image: yourrepo/ead-config:latest
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
